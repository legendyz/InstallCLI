<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Copilot CLI 安装引导</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title" data-i18n="app.title">GitHub Copilot CLI 安装引导</h1>
    </div>
    <div class="header-right">
      <select id="lang-switcher" class="lang-switcher" aria-label="Language"></select>
    </div>
  </header>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <nav class="step-nav">
        <ol id="step-list" class="step-list"></ol>
      </nav>
      <button class="btn btn-ghost btn-reset" id="btn-reset" data-i18n="btn.reset">重新开始</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Welcome Screen -->
      <section id="welcome-screen" class="screen welcome-screen">
        <div class="welcome-hero">
          <div class="welcome-icon">🤖</div>
          <h2 data-i18n="app.title">GitHub Copilot CLI 安装引导</h2>
          <p class="welcome-subtitle" data-i18n="app.subtitle"></p>
          <p class="welcome-intro" data-i18n="welcome.intro"></p>
        </div>

        <div class="welcome-options">
          <!-- Language Selection -->
          <div class="option-group">
            <label data-i18n="welcome.select.lang">语言 / Language</label>
            <div class="option-cards" id="lang-cards"></div>
          </div>

          <!-- OS Selection -->
          <div class="option-group">
            <label data-i18n="welcome.select.os">选择你的操作系统</label>
            <div class="option-cards" id="os-cards">
              <button class="option-card" data-os="windows">
                <span class="option-icon">🪟</span>
                <span class="option-label">Windows</span>
              </button>
              <button class="option-card" data-os="macos">
                <span class="option-icon">🍎</span>
                <span class="option-label">macOS</span>
              </button>
              <button class="option-card" data-os="linux">
                <span class="option-icon">🐧</span>
                <span class="option-label">Linux</span>
              </button>
            </div>
          </div>

          <button class="btn btn-primary btn-lg" id="btn-start" data-i18n="welcome.start" disabled>开始安装</button>
        </div>
      </section>

      <!-- Step Content (dynamically filled) -->
      <section id="step-screen" class="screen step-screen" style="display:none;">
        <div class="step-header">
          <span class="step-badge" id="step-badge"></span>
          <h2 class="step-title" id="step-title"></h2>
          <span class="step-optional" id="step-optional" style="display:none;" data-i18n="optional"></span>
        </div>

        <div class="step-body" id="step-body"></div>

        <!-- FAQ Accordion -->
        <div class="faq-section" id="faq-section">
          <h3 data-i18n="faq.title">💡 常见问题</h3>
          <div class="accordion" id="faq-accordion"></div>
        </div>

        <!-- Navigation Buttons -->
        <div class="step-actions">
          <button class="btn btn-ghost" id="btn-prev" data-i18n="btn.prev">上一步</button>
          <div class="step-actions-right">
            <button class="btn btn-ghost" id="btn-skip" data-i18n="btn.skip" style="display:none;">跳过</button>
            <button class="btn btn-primary" id="btn-complete" data-i18n="btn.done">✅ 我已完成这一步</button>
          </div>
        </div>
      </section>

      <!-- Congratulations Screen -->
      <section id="congrats-screen" class="screen congrats-screen" style="display:none;">
        <div class="congrats-hero">
          <div class="congrats-fireworks">🎉🎊🥳</div>
          <h2 data-i18n="congrats.title">🎉 恭喜你！</h2>
          <p data-i18n="congrats.subtitle"></p>
        </div>
        <div class="congrats-body" id="congrats-body"></div>
      </section>
    </main>
  </div>

  <!-- Mobile sidebar toggle -->
  <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>

  <script src="js/i18n.js"></script>
  <script src="js/steps.js"></script>
  <script src="js/faq.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
